# Rockchip RK3588 octa core 4/8/16GB RAM SoC NVMe USB3 USB-C GbE
BOARD_NAME="Blueberry Edge"
#source family配置文件定义
BOARDFAMILY="rockchip-rk3588"
BOARD_MAINTAINER="hugsun"
#uboot config
BOOTCONFIG="rk3588-blueberry-edge_defconfig" 
BOOT_SOC="rk3588"
#支持不同版本内核
KERNEL_TARGET="legacy,vendor,edge"
KERNEL_TEST_TARGET="vendor,edge"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
#kernel dts
BOOT_FDT_FILE="rockchip/rk3588-blueberry-edge-v12-linux.dtb"
BOOT_SCENARIO="spl-blobs"
BOOT_SUPPORT_SPI="yes"
BOOT_SPI_RKSPI_LOADER="yes"
IMAGE_PARTITION_TABLE="gpt"
#DDR_BLOB='rk35/rk3588_ddr_lp4_2112MHz_lp5_2736MHz_v1.15.bin'
#BL31_BLOB='rk35/rk3588_bl31_v1.44.elf'
SRC_CMDLINE="loglevel=7 console=ttyS2,1500000 cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory swapaccount=1"
declare -g UEFI_EDK2_BOARD_ID="blueberry-edge" # This _only_ used for uefi-edk2-rk3588 extension

ENABLE_EXTENSIONS=mesa-vpu
# hciattach
declare -g BLUETOOTH_HCIATTACH_PARAMS="-s 115200 /dev/ttyS6 bcm43xx 1500000" # For the bluetooth-hciattach extension
enable_extension "bluetooth-hciattach" 

function post_family_tweaks__blueberry-edge_naming_audios() {
	display_alert "$BOARD" "Renaming rock5b audios" "info"

	mkdir -p $SDCARD/etc/udev/rules.d/
	echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-hdmi0-sound", ENV{SOUND_DESCRIPTION}="HDMI0 Audio"' > $SDCARD/etc/udev/rules.d/90-naming-audios.rules
	echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-hdmi1-sound", ENV{SOUND_DESCRIPTION}="HDMI1 Audio"' >> $SDCARD/etc/udev/rules.d/90-naming-audios.rules
	echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-hdmiin-sound", ENV{SOUND_DESCRIPTION}="HDMI-In Audio"' >> $SDCARD/etc/udev/rules.d/90-naming-audios.rules
	echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-dp0-sound", ENV{SOUND_DESCRIPTION}="DP0 Audio"' >> $SDCARD/etc/udev/rules.d/90-naming-audios.rules
	echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-es8316-sound", ENV{SOUND_DESCRIPTION}="ES8316 Audio"' >> $SDCARD/etc/udev/rules.d/90-naming-audios.rules

	return 0
}


function post_config_uboot_target__extra_configs_for_blueberry-edge_mainline_environment_in_spi() {
	[[ "${BRANCH}" != "edge" ]] && return 0

	display_alert "$BOARD" "u-boot configs for ${BOOTBRANCH} u-boot config BRANCH=${BRANCH}" "info"
	run_host_command_logged scripts/config --set-val CONFIG_ENV_IS_NOWHERE "n"
	run_host_command_logged scripts/config --set-val CONFIG_ENV_IS_IN_SPI_FLASH "y"
	run_host_command_logged scripts/config --set-val CONFIG_ENV_SECT_SIZE_AUTO "y"
	run_host_command_logged scripts/config --set-val CONFIG_ENV_OVERWRITE "y"
	run_host_command_logged scripts/config --set-val CONFIG_ENV_SIZE "0x20000"
	run_host_command_logged scripts/config --set-val CONFIG_ENV_OFFSET "0xc00000"
}

# Override family config for this board; let's avoid conditionals in family config.
function post_family_config__blueberry-edge_use_vendor_uboot() {
	display_alert "$BOARD" "Configuring $BOARD vendor u-boot" "info"
	declare -g BOOTDELAY=1 # build injects this into u-boot config. we can then get into UMS mode and avoid the whole rockusb/rkdeveloptool thing
	#uboot仓库地址
	BOOTSOURCE='http://cloud.hugsun.com.cn:15001/thirdparty/hugsun_uboot.git'
	#仓库分支指向
	BOOTBRANCH='branch:next-dev-v2024.10'
	#uboot补丁路经
	BOOTPATCHDIR="legacy/u-boot-radxa-rk35xx"
}


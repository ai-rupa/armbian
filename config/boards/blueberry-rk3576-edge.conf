# Rockchip RK3576 octa core 4/8/16GB RAM SoC NVMe USB3 USB-C GbE
BOARD_NAME="Blueberry rk3576 Edge"
BOARDFAMILY="rk35xx"
BOARD_MAINTAINER="hugsun"
BOOTCONFIG="rk3576-blueberry-edge_defconfig" 
BOOT_SOC="rk3576"
KERNEL_TARGET="vendor"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3576-blueberry-edge-v10.dtb"
BOOT_SCENARIO="spl-blobs"
IMAGE_PARTITION_TABLE="gpt"

# Override family config for this board; let's avoid conditionals in family config.
function post_family_config__blueberry-edge_use_vendor_uboot() {
	display_alert "$BOARD" "Configuring $BOARD vendor u-boot" "info"
	declare -g BOOTDELAY=1 # build injects this into u-boot config. we can then get into UMS mode and avoid the whole rockusb/rkdeveloptool thing

	BOOTSOURCE='http://cloud.hugsun.com.cn:15001/thirdparty/hugsun_uboot.git'
	BOOTBRANCH='branch:next-dev-v2024.10'
	BOOTPATCHDIR="legacy/u-boot-radxa-rk35xx"
}
# Rockchip RK3568 octa core 4/8/16GB RAM SoC NVMe USB3 USB-C GbE
BOARD_NAME="Blueberry Edge"
BOARDFAMILY="rk35xx"
BOARD_MAINTAINER="hugsun"
BOOTCONFIG="rk3568_defconfig"
BOOT_SOC="rk3568"
KERNEL_TARGET="legacy,vendor,edge"
KERNEL_TEST_TARGET="vendor,edge"
FULL_DESKTOP="no"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3568-hugsun-edge-v11-linux.dtb"
BOOT_SCENARIO="spl-blobs"
BOOT_SUPPORT_SPI="yes"
BOOT_SPI_RKSPI_LOADER="yes"
IMAGE_PARTITION_TABLE="gpt"

# Override family config for this board; let's avoid conditionals in family config.
function post_family_config__blueberry-edge_use_vendor_uboot() {
	#BOOTSOURCE='https://github.com/radxa/u-boot.git'
	#declare -g BOOTBRANCH='branch:next-dev' # disabled, using specific commit below to avoid breakage in the future
	#BOOTBRANCH="commit:609a77ef6e99c56aacd4b8d8f9c3056378f9c761" # specific commit in next-dev branch; tested to work
	#BOOTDIR="u-boot-meko-rk3588"             # do not share u-boot directory
	#BOOTPATCHDIR="legacy/u-boot-meko-rk3588" # Few patches in there; MAC address & defconfig


	BOOTSOURCE='https://gitee.com/hugsun/u-boot.git'
	BOOTBRANCH='branch:hugsun_linux_rkr7'
	BOOTPATCHDIR="legacy/u-boot-hugsun-rk3588"
}

